[package]
name = "novawm"
version = "0.1.0"
edition = "2024"
authors = ["frqme"]
license = "AGPL-3.0-only"
[[bin]]
name = "novactl"
path = "src/bin/novactl.rs"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3.16", features = ["env-filter"] }
bitflags = "2.2.1"
thiserror = "1"
kdl = "6.7.1"
image = "0.24.7"
smithay-drm-extras = { git = "https://github.com/Smithay/smithay", rev = "e3d461a", default-features = false }
xkbcommon = "0.9.0"
xcursor = "0.3"
ctrlc = "3.5.2"

[dependencies.smithay]
git = "https://github.com/Smithay/smithay"
default-features = false
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
    "backend_drm",
    "backend_gbm",
    "backend_udev",
    "backend_libinput",
    "backend_session_libseat",
    "backend_egl",
    "renderer_gl",
    "renderer_multi",
]
